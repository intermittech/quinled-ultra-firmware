# QuinLED dig2analog-ultra-5ch in Ultra mode, with board firmware updates from this repository's releases.
# The full light setups (RGBCCT, downlights, strips) are in the esphome-ws2915-ws2805 repository's examples/:
# https://github.com/intermittech/esphome-ws2915-ws2805/tree/main/examples
# Updates: https://github.com/intermittech/quinled-ultra-firmware/wiki/Updating-Over-The-Data-Line
esphome:
  name: d2a-ultra

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/esphome-ws2915-ws2805@main
    components: [dig2analog_ultra]

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

http_request:                     # downloads the releases (HTTPS, GitHub's redirects)

dig2analog_ultra:
  id: ultra
  pin: GPIO16                     # to the first board's Data-In
  num_boards: 2

light:
  - platform: dig2analog_ultra
    name: Kitchen
    board: 0
    red: 1
    green: 2
    blue: 3
    warm_white: 4
    cold_white: 5
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K

update:
  - platform: dig2analog_ultra
    dig2analog_ultra_id: ultra
    id: board_fw
    name: Board firmware
    channel: stable               # stable, beta or alpha
    status:                       # what it does now, and the blink legend afterwards
      name: Board firmware status

button:
  - platform: template
    name: Board firmware - install again
    entity_category: config
    on_press:
      - update.perform:
          id: board_fw
          force_update: true      # also the same or an older version (the boards take it)
